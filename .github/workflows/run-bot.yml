name: Run Encoder Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write   # temp Releases (worker mailbox + parts)
  actions: write    # workers dispatch කරන්න

# එකවර bot instance දෙකක් run වෙන එක වළක්වනවා (එකම token එකට conflict වෙනවා)
concurrency:
  group: encoder-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Fast Install FFmpeg
        run: |
          curl -fsSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ --strip-components=1 -C /tmp --wildcards '*/ffmpeg' '*/ffprobe'
          sudo mv /tmp/ffmpeg /tmp/ffprobe /usr/local/bin/
          ffmpeg -hide_banner -encoders | grep -E "libx264|libx265"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode & Assemble User Strings
        env:
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          # secrets context එකෙන් USER_STRING_ වලින් පටන් ගන්නා සියල්ල (USER_STRING_1, 2, 3, 4...) 
          # ස්වයංක්‍රීයව decode කර comma-separated string එකක් ලෙස සකසයි
          USER_STRINGS=$(python3 -c '
          import json, os, base64

          secrets = json.loads(os.environ.get("SECRETS_CONTEXT", "{}"))
          keys = sorted([k for k in secrets if k.startswith("USER_STRING_")])

          sessions = []
          for k in keys:
              val = secrets[k].strip()
              if val:
                  try:
                      decoded = base64.b64decode(val).decode("utf-8").strip()
                      sessions.append(decoded)
                  except Exception:
                      sessions.append(val)

          print(",".join(sessions))
          ')

          echo "USER_STRINGS=$USER_STRINGS" >> $GITHUB_ENV

      - name: Run Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          # ඉහත පියවරෙන් dynamic ලෙස decode වූ strings (නැතහොත් secrets.USER_STRINGS වෙතින්)
          USER_STRINGS: ${{ env.USER_STRINGS || secrets.USER_STRINGS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}          # -100xxxxxxxxxx  (හෝ invite link)
          HELPER_TOKENS: ${{ secrets.HELPER_TOKENS }}    # tokenA,tokenB,tokenC,tokenD (classic PAT: repo + workflow)
          # Download tuning (4 Userbot accounts × 8 connections = up to 32 lanes)
          UB_DL_CONNECTIONS: ${{ vars.UB_DL_CONNECTIONS || '8' }}
          UB_DL_WORKERS_PER_CONN: ${{ vars.UB_DL_WORKERS_PER_CONN || '4' }}
          UB_DL_MAX_WORKERS: ${{ vars.UB_DL_MAX_WORKERS || '128' }}
          UB_DL_MAX_RETRIES: ${{ vars.UB_DL_MAX_RETRIES || '10' }}
          UB_DL_CHUNK_TIMEOUT: ${{ vars.UB_DL_CHUNK_TIMEOUT || '35' }}
          UB_DL_HEDGE_AFTER: ${{ vars.UB_DL_HEDGE_AFTER || '6' }}
          UB_DL_HEDGE_MAX: ${{ vars.UB_DL_HEDGE_MAX || '2' }}
          UB_UL_CONNECTIONS: ${{ vars.UB_UL_CONNECTIONS || '12' }}
          UB_MAX_FLOOD_WAIT: ${{ vars.UB_MAX_FLOOD_WAIT || '30' }}
          PROGRESS_UPDATE_INTERVAL: ${{ vars.PROGRESS_UPDATE_INTERVAL || '3' }}
          QUEUE_MAX: ${{ vars.QUEUE_MAX || '20' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DIST_WORKERS: ${{ vars.DIST_WORKERS || '10' }}   # default workers (/settings වලින් වෙනස් කරන්න පුළුවන්: 5-50)
          DOWNLOAD_DIR: ${{ runner.temp }}/downloads
        run: |
          python3 -u bot.py
