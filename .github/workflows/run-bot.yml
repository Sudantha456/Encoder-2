name: Run Encoder Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write   # temp Releases (worker mailbox + parts)
  actions: write    # workers dispatch කරන්න

# එකවර bot instance දෙකක් run වෙන එක වළක්වනවා (එකම token එකට conflict වෙනවා)
concurrency:
  group: encoder-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Fast Install FFmpeg
        run: |
          curl -fsSL --retry 3 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
            | tar -xJ --strip-components=1 -C /tmp --wildcards '*/ffmpeg' '*/ffprobe'
          sudo mv /tmp/ffmpeg /tmp/ffprobe /usr/local/bin/
          ffmpeg -hide_banner -encoders | grep -E "libx264|libx265"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode & Assemble User Strings
        env:
          S1: ${{ secrets.USER_STRING_1 }}
          S2: ${{ secrets.USER_STRING_2 }}
          S3: ${{ secrets.USER_STRING_3 }}
        run: |
          sessions=()

          # එක් එක් secret අගයක් ඇත්නම් පමණක් base64 decode කර array එකට එකතු කරයි
          [ -n "$S1" ] && sessions+=("$(echo "$S1" | base64 -d)")
          [ -n "$S2" ] && sessions+=("$(echo "$S2" | base64 -d)")
          [ -n "$S3" ] && sessions+=("$(echo "$S3" | base64 -d)")

          # Comma-separated තනි string එකක් සාදා GITHUB_ENV එකට ලියයි
          IFS=','
          assembled="${sessions[*]}"
          echo "USER_STRINGS=$assembled" >> $GITHUB_ENV

      - name: Run Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
          # ඉහත Decode පියවරෙන් decode වී ලැබුණු string එක ලබා ගනී (නැතහොත් secrets.USER_STRINGS වෙතින්)
          USER_STRINGS: ${{ env.USER_STRINGS || secrets.USER_STRINGS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}          # -100xxxxxxxxxx  (හෝ invite link)
          HELPER_TOKENS: ${{ secrets.HELPER_TOKENS }}    # tokenA,tokenB,tokenC,tokenD (classic PAT: repo + workflow)
          UB_DL_CONNECTIONS: ${{ vars.UB_DL_CONNECTIONS || '6' }}
          UB_UL_CONNECTIONS: ${{ vars.UB_UL_CONNECTIONS || '6' }}
          UB_MAX_FLOOD_WAIT: ${{ vars.UB_MAX_FLOOD_WAIT || '30' }}
          PROGRESS_UPDATE_INTERVAL: ${{ vars.PROGRESS_UPDATE_INTERVAL || '3' }}
          QUEUE_MAX: ${{ vars.QUEUE_MAX || '20' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DIST_WORKERS: ${{ vars.DIST_WORKERS || '10' }}   # default workers (/settings වලින් වෙනස් කරන්න පුළුවන්: 5-50)
          DOWNLOAD_DIR: ${{ runner.temp }}/downloads
        run: |
          python3 -u bot.py
